[package]
name = "kaans-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kaans_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tauri-plugin-notification = "2"
portable-pty = "0.9"
interprocess = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.14.0"
sha2 = "0.10"
# Sosyal sunucu istemcisi (yalnızca Rust tarafı; token sayfaya girmez). Sürüm sabit.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
# Canlı bağlantı (arkadaş durumu, mesajlar). Sürüm sabit.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Mesajlarda uçtan uca şifreleme (NaCl box: X25519 + XSalsa20-Poly1305, libsodium crypto_box ile aynı). Sürüm sabit.
crypto_box = "=0.9.1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target."cfg(target_os = \"macos\")".dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSSet"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSTouch", "NSResponder", "NSView", "block2"] }
objc2 = "0.6"
block2 = "0.6"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }
